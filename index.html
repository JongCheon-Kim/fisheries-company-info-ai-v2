<script>

const COMPANY_DB_URL="./companies.json";
const COORD_DB_URL="./coordinates.json";
const RELATION_DB_URL="./relations.json";
const STATS_DB_URL="./stats.json";
const ADDRESS_QUEUE_URL="./address_queue.json";

const state={
  company:null,listRows:[],listLoaded:false,listLoading:null,
  coordinateByKey:new Map(),relationsByRecord:new Map(),stats:null,
  map:null,markerLayer:null,mapRows:[],addressGroups:new Map(),
  mapFilters:new Set(["production","processing","distribution","foodservice"]),
  regionFilter:"전체",suggestOpen:false,lastSuggestTotal:0,searchSector:"all",suggestDragging:false
};

const chat=document.getElementById("chat");
const sheetBg=document.getElementById("sheetBg");
const sheet=document.getElementById("sheet");
const input=document.getElementById("chatInput");
const suggest=document.getElementById("mainSuggest");
const suggestList=document.getElementById("mainSuggestList");
const searchSectorBar=document.getElementById("searchSectorBar");
const searchSectorHint=document.getElementById("searchSectorHint");
const dropBtn=document.getElementById("mainDropBtn");

function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function fmt(v){
  if(v===null||v===undefined||v==="")return "-";
  const n=Number(String(v).replace(/,/g,""));
  return Number.isFinite(n)?n.toLocaleString("ko-KR"):esc(v)
}
function fmtShort(v){
  if(v===null||v===undefined||v==="")return "-";
  const n=Number(String(v).replace(/,/g,""));
  if(!Number.isFinite(n))return esc(v);
  const a=Math.abs(n);
  if(a>=100000000)return (n/100000000).toFixed(a>=1000000000?1:2).replace(/\.0+$/,"")+"억";
  if(a>=10000)return (n/10000).toFixed(a>=100000?1:2).replace(/\.0+$/,"")+"만";
  return n.toLocaleString("ko-KR");
}
function add(html,who="bot"){
  exitMapMode();
  const r=document.createElement("div");r.className=`row ${who}`;r.innerHTML=`<div class="bubble">${html}</div>`;

function cleanName(v=""){return String(v||"").replace(/\s*\(\s*\)\s*$/,"").replace(/\s+/g," ").trim()}
function inferRegion(a=""){

  if(/대전|세종|충청|충북|충남/.test(a))return"충청";

  if(/부산|대구|울산|경상|경북|경남/.test(a))return"영남";

async function loadStaticData(force=false){
  if(state.listLoaded&&!force)return state.listRows;
  if(state.listLoading&&!force)return state.listLoading;
  state.listLoading=(async()=>{
    const [cr,gr,rr,sr]=await Promise.all([
      fetch(COMPANY_DB_URL,{cache:"no-cache"}),fetch(COORD_DB_URL,{cache:"no-cache"}),
      fetch(RELATION_DB_URL,{cache:"no-cache"}),fetch(STATS_DB_URL,{cache:"no-cache"})
    ]);
    if(!cr.ok)throw new Error(`기업 DB HTTP ${cr.status}`);
    if(!gr.ok)throw new Error(`좌표 DB HTTP ${gr.status}`);
    if(!rr.ok)throw new Error(`관계 DB HTTP ${rr.status}`);
    if(!sr.ok)throw new Error(`통계 DB HTTP ${sr.status}`);
    const [companies,coords,relations,stats]=await Promise.all([cr.json(),gr.json(),rr.json(),sr.json()]);
    state.listRows=(companies||[]).map(r=>({...r,companyName:cleanName(r.companyName),regionGroup:r.regionGroup||inferRegion(r.address||"")}));
    state.coordinateByKey=new Map(
      (coords||[]).filter(x=>x.addressKey&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lng)))
      .map(x=>[String(x.addressKey),{lat:Number(x.lat),lng:Number(x.lng),provider:x.provider||x.geocodeProvider||"static",status:x.status||x.geocodeStatus||"OK",matchedAddress:x.matchedAddress||x.geocodeMatchedAddress||""}])
    );
    const rm=new Map();
    for(const x of relations||[]){const k=String(x.recordId||"");if(!rm.has(k))rm.set(k,[]);rm.get(k).push(x)}
    state.relationsByRecord=rm;state.stats=stats||{};state.listLoaded=true;state.listLoading=null;
    rebuildMapRows();renderSuggest(input.value||"");return state.listRows
  })().catch(e=>{state.listLoading=null;throw e});
  return state.listLoading
}
async function ensureData(){
  try{return await loadStaticData()}
  catch(e){add(`<h3>통합 DB 로딩 오류</h3><div class="err">${esc(e.message)}</div><div class="source">GitHub Pages 저장소 루트의 JSON 파일을 확인하십시오.</div>`);return[]}
}
function rebuildMapRows(){
  state.mapRows=[];state.addressGroups=new Map();
  for(const r of state.listRows){
    const p=state.coordinateByKey.get(String(r.addressKey||""));if(!p)continue;
    const normalizedSector=["production","processing","distribution","foodservice"].includes(r.sector)?r.sector:
      (/생산|어업/.test(r.sectorGroup||r.sectorLabel||"")?"production":
       /제조|가공/.test(r.sectorGroup||r.sectorLabel||"")?"processing":
       /도매|소매|유통/.test(r.sectorGroup||r.sectorLabel||"")?"distribution":
       /외식|음식점/.test(r.sectorGroup||r.sectorLabel||"")?"foodservice":r.sector);
    const item={id:r.recordId,addressKey:r.addressKey,name:r.companyName,sector:normalizedSector,sectorLabel:r.sectorLabel,subType:r.subType,industry:r.ksicName||r.subType||"",address:r.address||r.geocodeCandidate1||"",regionGroup:r.regionGroup,sales:r.sales,operatingProfit:r.operatingProfit,netProfit:r.netProfit,representative:r.representative,sourceYear:r.sourceYear,lat:p.lat,lng:p.lng,company:r};
    state.mapRows.push(item);
    const k=String(r.addressKey);if(!state.addressGroups.has(k))state.addressGroups.set(k,[]);state.addressGroups.get(k).push(item)
  }
}

function yearsHtml(years){
  if(!years.length)return `<div class="empty-card">선택 가능한 재무 연도가 없습니다.</div>`;
  return `<div class="section-title">② 조회 연도</div><div class="year-grid">${years.map(y=>`<label class="year-card on"><input type="checkbox" data-year="${esc(y)}" checked onchange="this.parentElement.classList.toggle('on',this.checked)">${esc(y)}</label>`).join("")}</div>`

function yearValue(r,y,field){
  const h=r?.financialHistory||{};if(h[y]&&h[y][field]!==undefined)return h[y][field];
  if(String(r?.sourceYear)===String(y))return r?.[field];return null
}
function numericValue(v){if(v===null||v===undefined||v==="")return null;const n=Number(String(v).replace(/,/g,""));return Number.isFinite(n)?n:null}
function metricObject(r,label,field,years){
  const values=years.map(y=>({year:y,raw:yearValue(r,y,field),numeric:numericValue(yearValue(r,y,field))})).filter(v=>v.raw!==null&&v.raw!==undefined&&v.raw!=="");
  return {label,unit:"원자료 단위",found:values.length>0,values,years}
}
function spark(values){
  const nums=values.map(v=>Number(v.numeric)).filter(Number.isFinite);if(nums.length<2)return"";
  const min=Math.min(...nums),max=Math.max(...nums),span=max-min||1;
  const pts=values.map((v,i)=>{const x=4+i*(92/Math.max(1,values.length-1));const y=36-((Number(v.numeric)-min)/span)*30;return`${x},${y}`}).join(" ");
  return `<div class="trend"><svg viewBox="0 0 100 42" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#d4a600" stroke-width="2.4"/><line x1="0" y1="38" x2="100" y2="38" stroke="#e9edf0"/></svg></div>`
}
function metricHtml(m){

  return `<div class="metric-card"><div class="metric-head"><b>${esc(m.label)}</b><span>${esc(m.unit||"")}</span></div>${spark(m.values||[])}<table class="mini-table"><thead><tr><th>연도</th>${(m.values||[]).map(v=>`<th>${esc(v.year)}</th>`).join("")}</tr></thead><tbody><tr><td>값</td>${(m.values||[]).map(v=>`<td>${fmt(v.raw)}</td>`).join("")}</tr></tbody></table></div>`
}
function financialHealthHtml(r,years){
  const rows=years.map(y=>{
    const a=numericValue(yearValue(r,y,"assets")),l=numericValue(yearValue(r,y,"liabilities")),e=numericValue(yearValue(r,y,"equity"));
    return {y,a,l,e,debt:(e!==null&&e!==0&&l!==null)?l/e*100:null,equityRatio:(a!==null&&a!==0&&e!==null)?e/a*100:null}
  });
  const any=rows.some(x=>x.a!==null||x.l!==null||x.e!==null);
  if(!any)return `<div class="empty-card"><b>재무 건전성</b> · 선택 연도의 자산·부채·자본 값이 현재 정적 DB에 저장되어 있지 않습니다.</div>`;
  return `<div class="metric-card"><div class="metric-head"><b>재무 건전성</b><span>결측은 -</span></div><div class="statement-wrap"><table class="statement-table"><thead><tr><th>연도</th><th>자산총계</th><th>부채총계</th><th>자본총계</th><th>부채비율</th><th>자기자본비율</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.y)}</td><td>${x.a===null?"-":fmt(x.a)}</td><td>${x.l===null?"-":fmt(x.l)}</td><td>${x.e===null?"-":fmt(x.e)}</td><td>${x.debt===null?"-":x.debt.toFixed(1)+"%"}</td><td>${x.equityRatio===null?"-":x.equityRatio.toFixed(1)+"%"}</td></tr>`).join("")}</tbody></table></div></div>`
}
function trendSummaryHtml(r,years){

function initDraggableMapStatus(){
  const wrap=document.querySelector(".map-canvas-wrap");
  const panel=document.getElementById("mapStatusBanner");
  const handle=document.getElementById("mapStatusHandle");
  const collapse=document.getElementById("mapStatusCollapse");
  const close=document.getElementById("mapStatusClose");
  if(!wrap||!panel||!handle)return;

  panel.classList.add("hidden");

  // 지도 기본화면에서는 좌표 안내박스를 표시하지 않는다.
  try{
    const savedCollapsed=sessionStorage.getItem("kafvMapStatusCollapsed");
    const collapsed=savedCollapsed===null ? true : savedCollapsed==="1";
    panel.classList.toggle("collapsed",collapsed);
    if(collapse){
      collapse.textContent=collapsed?"+":"―";
      collapse.title=collapsed?"펼치기":"접기";
    }
    const saved=JSON.parse(sessionStorage.getItem("kafvMapStatusPos")||"null");
    if(saved&&Number.isFinite(saved.x)&&Number.isFinite(saved.y)){
      panel.style.right="auto";
      panel.style.left=saved.x+"px";
      panel.style.top=saved.y+"px";
    }
  }catch{}

  const clamp=()=>{
    const wr=wrap.getBoundingClientRect();
    const pr=panel.getBoundingClientRect();
    let x,y;
    if(panel.style.left){
      x=parseFloat(panel.style.left);
      y=parseFloat(panel.style.top)||8;
    }else{
      x=Math.max(4,wr.width-pr.width-8);
      y=8;
      panel.style.right="auto";
    }
    x=Math.max(4,Math.min(x,Math.max(4,wr.width-pr.width-4)));
    y=Math.max(4,Math.min(y,Math.max(4,wr.height-pr.height-4)));
    panel.style.left=x+"px";
    panel.style.top=y+"px";
    return {x,y};
  };

  requestAnimationFrame(clamp);

  let drag=null;
  handle.onpointerdown=e=>{
    if(e.target.closest("button"))return;
    if(e.pointerType==="mouse"&&e.button!==0)return;
    const pr=panel.getBoundingClientRect();
    drag={id:e.pointerId,dx:e.clientX-pr.left,dy:e.clientY-pr.top};
    panel.classList.add("dragging");
    try{handle.setPointerCapture(e.pointerId)}catch{}
    e.preventDefault();e.stopPropagation();
  };
  handle.onpointermove=e=>{
    if(!drag||drag.id!==e.pointerId)return;
    const wr=wrap.getBoundingClientRect(),pr=panel.getBoundingClientRect();
    let x=e.clientX-wr.left-drag.dx;
    let y=e.clientY-wr.top-drag.dy;
    x=Math.max(4,Math.min(x,Math.max(4,wr.width-pr.width-4)));
    y=Math.max(4,Math.min(y,Math.max(4,wr.height-pr.height-4)));
    panel.style.right="auto";
    panel.style.left=x+"px";
    panel.style.top=y+"px";
    e.preventDefault();e.stopPropagation();
  };
  const end=e=>{
    if(!drag||drag.id!==e.pointerId)return;
    panel.classList.remove("dragging");
    const p=clamp();
    try{sessionStorage.setItem("kafvMapStatusPos",JSON.stringify(p))}catch{}
    try{handle.releasePointerCapture(e.pointerId)}catch{}
    drag=null;
    e.preventDefault();e.stopPropagation();
  };
  handle.onpointerup=end;
  handle.onpointercancel=end;

  if(collapse){
    collapse.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      panel.classList.toggle("collapsed");
      const isCollapsed=panel.classList.contains("collapsed");
      collapse.textContent=isCollapsed?"+":"―";
      collapse.title=isCollapsed?"펼치기":"접기";
      try{sessionStorage.setItem("kafvMapStatusCollapsed",isCollapsed?"1":"0")}catch{}
      requestAnimationFrame(()=>{
        const p=clamp();
        try{sessionStorage.setItem("kafvMapStatusPos",JSON.stringify(p))}catch{}
      });
    };
  }
  if(close){
    close.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      panel.classList.add("hidden");
    };
  }

  // 버튼/패널 조작을 Leaflet 지도 드래그로 전달하지 않음.
  panel.addEventListener("click",e=>e.stopPropagation());
  panel.addEventListener("dblclick",e=>e.stopPropagation());
  panel.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});
}

function initDraggableMapLegend(){
  const wrap=document.getElementById("phone");
  const legend=document.getElementById("mapLegend");
  const handle=document.getElementById("mapLegendHandle");
  const reset=document.getElementById("mapLegendReset");
  if(!wrap||!legend||!handle)return;

  // v2.1: Leaflet 지도 pane보다 위, 선택 sheet보다 아래인 독립 phone 오버레이.
  legend.style.zIndex="1200";

  const storageKey="kafvMapLegendPhonePosV21";
  const defaultPos=()=>{
    const wr=wrap.getBoundingClientRect(),lr=legend.getBoundingClientRect();
    const x=Math.max(4,wr.width-lr.width-10);
    const y=Math.max(72,Math.min(132,Math.max(72,wr.height-lr.height-150)));
    return {x,y};
  };
  const applyPos=p=>{
    legend.style.left=p.x+"px";
    legend.style.top=p.y+"px";
    legend.style.right="auto";
    legend.style.bottom="auto";
  };
  const clamp=()=>{
    const wr=wrap.getBoundingClientRect(),lr=legend.getBoundingClientRect();
    let x=parseFloat(legend.style.left),y=parseFloat(legend.style.top);
    if(!Number.isFinite(x)||!Number.isFinite(y)){
      const d=defaultPos();x=d.x;y=d.y;
    }
    x=Math.max(4,Math.min(x,Math.max(4,wr.width-lr.width-4)));
    y=Math.max(4,Math.min(y,Math.max(4,wr.height-lr.height-4)));
    applyPos({x,y});
    return {x,y};
  };

  let restored=false;
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
    if(saved&&Number.isFinite(saved.x)&&Number.isFinite(saved.y)){
      applyPos(saved);restored=true;
    }
  }catch{}
  requestAnimationFrame(()=>{
    if(!restored)applyPos(defaultPos());
    const p=clamp();
    try{localStorage.setItem(storageKey,JSON.stringify(p))}catch{}
  });

  let drag=null;
  handle.onpointerdown=e=>{
    if(e.target.closest("#mapLegendReset"))return;
    if(e.pointerType==="mouse"&&e.button!==0)return;
    const lr=legend.getBoundingClientRect();
    drag={pointerId:e.pointerId,dx:e.clientX-lr.left,dy:e.clientY-lr.top};
    legend.classList.add("dragging");
    try{handle.setPointerCapture(e.pointerId)}catch{}
    e.preventDefault();e.stopPropagation();
  };
  handle.onpointermove=e=>{
    if(!drag||drag.pointerId!==e.pointerId)return;
    const wr=wrap.getBoundingClientRect(),lr=legend.getBoundingClientRect();
    let x=e.clientX-wr.left-drag.dx,y=e.clientY-wr.top-drag.dy;
    x=Math.max(4,Math.min(x,Math.max(4,wr.width-lr.width-4)));
    y=Math.max(4,Math.min(y,Math.max(4,wr.height-lr.height-4)));
    applyPos({x,y});
    e.preventDefault();e.stopPropagation();
  };
  const end=e=>{
    if(!drag||drag.pointerId!==e.pointerId)return;
    legend.classList.remove("dragging");
    const p=clamp();
    try{localStorage.setItem(storageKey,JSON.stringify(p))}catch{}
    try{handle.releasePointerCapture(e.pointerId)}catch{}
    drag=null;e.preventDefault();e.stopPropagation();
  };
  handle.onpointerup=end;handle.onpointercancel=end;

  // 지도 조작 이벤트와 범례 조작 이벤트를 완전히 분리한다.
  legend.querySelectorAll("input,label,button").forEach(el=>{
    el.addEventListener("pointerdown",e=>e.stopPropagation());
    el.addEventListener("click",e=>e.stopPropagation());
  });
  legend.addEventListener("click",e=>e.stopPropagation());
  legend.addEventListener("dblclick",e=>e.stopPropagation());
  legend.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});

  if(reset){
    reset.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      const p=defaultPos();applyPos(p);clamp();
      try{localStorage.setItem(storageKey,JSON.stringify(p));localStorage.removeItem("kafvMapLegendPhonePos")}catch{}
    };
  }
  if(!window.__kafvPhoneLegendResizeBound){
    window.addEventListener("resize",()=>{if(document.getElementById("mapLegend"))clamp()});
    window.__kafvPhoneLegendResizeBound=true;
  }
}

  }
  const counts={};for(const x of rows)counts[x.sectorLabel]=(counts[x.sectorLabel]||0)+1;
  return `<div class="map-core-tip"><div class="tip-title">동일 주소 ${rows.length}개 기업</div><div class="tip-badges">${Object.entries(counts).map(([k,v])=>`<span class="tip-badge">${esc(k)} ${v}</span>`).join("")}</div><div class="tip-grid"><b>주소</b><span>${esc(r.address||"-")}</span><b>기업</b><span>${rows.slice(0,4).map(x=>esc(x.name)).join("<br>")}${rows.length>4?`<br>외 ${rows.length-4}개`:""}</span></div><div class="tip-hint">클릭하면 이 주소의 기업목록을 엽니다.</div></div>`
}
function markerForGroup(rows){
  const r=rows[0],sectors=[...new Set(rows.map(x=>x.sector))];
  let icon;
  if(rows.length===1){
    icon=L.divIcon({className:"",html:`<div class="single-company-marker" style="background:${sectorColor(r.sector)}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})
  }else if(sectors.length>1){
    icon=L.divIcon({className:"",html:`<div class="multi-sector-marker">${rows.length}</div>`,iconSize:[28,28],iconAnchor:[14,14]})
  }else{
    icon=L.divIcon({className:"",html:`<div class="marker-address-count" style="background:${sectorColor(sectors[0])}">${rows.length}</div>`,iconSize:[28,28],iconAnchor:[14,14]})
  }
  const m=L.marker([r.lat,r.lng],{icon,title:rows.length===1?r.name:`${rows.length}개 기업`});
  m.bindTooltip(coreTooltip(rows),{direction:"top",offset:[0,-8],opacity:.99,sticky:false,className:"company-tooltip"});
  m.on("click",()=>{state.map.setView([r.lat,r.lng],Math.max(state.map.getZoom(),13));openMapCompanySheet(rows)});
  return m
}
function renderMapRows(){
  if(!state.markerLayer)return;state.markerLayer.clearLayers();
  const markers=[];for(const rows of groupedVisible().values())markers.push(markerForGroup(rows));
  state.markerLayer.addLayers(markers);updateMapCount();updateMapBanner()
}
function openMapCompanySheet(rows){
  const one=rows.length===1;
  const body=rows.slice(0,80).map(r=>`<div class="map-company-sheet-summary"><h3>${esc(r.name)}</h3><div class="kv"><b>산업부문</b><span>${esc(r.sectorLabel)}</span><b>세부업종</b><span>${esc(r.subType||"-")}</span><b>대표자</b><span>${esc(r.representative||"-")}</span><b>매출액</b><span>${fmt(r.sales)}</span><b>영업이익</b><span>${fmt(r.operatingProfit)}</span><b>순이익</b><span>${fmt(r.netProfit)}</span></div><div class="map-company-sheet-actions"><button class="core-btn" onclick="chooseMapCompany('${esc(r.id)}','core')">핵심정보</button><button class="detail-btn" onclick="chooseMapCompany('${esc(r.id)}','detail')">상세정보</button></div></div>`).join("");
  setSheet(`${sheetHead(one?"기업정보":`동일주소 기업 ${rows.length}개`)}${one?"":`<div class="hint">${esc(rows[0].address||"")}</div>`}${body}${rows.length>80?`<div class="hint">80개까지 표시했습니다. 나머지는 하단 기업검색을 이용하십시오.</div>`:""}`)
}
function chooseMapCompany(recordId,mode){
  const r=findRecord(recordId);if(!r)return;state.company=r;closeSheet();
  if(mode==="core")openCore();else openDetail()
}
function updateMapCount(){
  const chip=document.getElementById("mapCountChip");
  const coordChip=document.getElementById("mapCoordChip");
  const status=document.getElementById("mapDirectoryStatus");
  const visible=visibleMapRows().length,g=groupedVisible().size;
  if(chip)chip.textContent=`${fmt(g)}곳`;
  if(coordChip)coordChip.textContent=`좌표 ${fmt(state.coordinateByKey.size)}`;
  if(status)status.textContent=`기업 ${fmt(state.listRows.length)}개 · 표시기업 ${fmt(visible)}개 · 마커 ${fmt(g)}곳 · 좌표기업 ${fmt(state.mapRows.length)}개`
}
function updateMapBanner(){
  const el=document.getElementById("mapStatusBanner");
  const title=document.querySelector("#mapStatusBanner .map-status-title");
  const body=document.getElementById("mapStatusBody");
  if(!el||!body)return;
  const total=Number(state.stats?.uniqueAddresses||0),done=state.coordinateByKey.size;
  if(title)title.textContent=`좌표 DB ${fmt(done)} / ${fmt(total)}`;
  if(done>=total&&total>0){el.className="map-status-banner ok collapsed hidden";body.innerHTML=`고유주소 ${fmt(done)}개 좌표 확보 완료`}
  else{el.className="map-status-banner warn collapsed hidden";body.innerHTML=`성공좌표 ${fmt(done)}개 / 고유주소 ${fmt(total)}개 · 좌표 미확보 주소는 지도에서 제외하며 후속 QA에서 보정합니다.`}
}

function fitCompanies(){const rows=visibleMapRows();if(!state.map||!rows.length)return fitKorea();state.map.fitBounds(L.latLngBounds(rows.map(r=>[r.lat,r.lng])),{padding:[30,30],maxZoom:13})}
function fitKorea(){state.map?.setView([36.3,127.8],6.4)}
function showCoordinateStatus(){setSheet(`${sheetHead("좌표 DB 현황")}<div class="kv"><b>기업 전체</b><span>${fmt(state.listRows.length)}</span><b>고유주소</b><span>${fmt(state.stats?.uniqueAddresses)}</span><b>좌표 주소</b><span>${fmt(state.coordinateByKey.size)}</span><b>좌표 기업</b><span>${fmt(state.mapRows.length)}</span><b>미확보 주소</b><span>${fmt(Math.max(0,Number(state.stats?.uniqueAddresses||0)-state.coordinateByKey.size))}</span></div><div class="hint">현재 확보된 성공좌표를 우선 지도에 사용합니다. 좌표 미확보 주소는 별도 실패목록으로 보관하여 후속 보정합니다.</div>`) }

const FEATURE_SEARCH_ITEMS=[
  {section:"기능",title:"기업지도",sub:"전국 수산기업 분포·산업부문",action:"map"},
  {section:"기능",title:"핵심정보",sub:"기업개요·핵심재무 선택",action:"core"},
  {section:"기능",title:"상세정보",sub:"재무·거래관계·기업상세",action:"detail"},
  {section:"기능",title:"특허·저장",sub:"특허정보·CSV·지도조건",action:"save"}
];
const SEARCH_SECTORS=[
  {key:"all",label:"전체"},
  {key:"production",label:"생산"},
  {key:"processing",label:"가공"},
  {key:"distribution",label:"유통"},
  {key:"foodservice",label:"외식"}
];
function sectorCount(key){
  if(key==="all")return state.listRows.length;
  return state.listRows.filter(r=>r.sector===key).length
}
function renderSearchSectorBar(){
  if(!searchSectorBar)return;
  searchSectorBar.innerHTML=SEARCH_SECTORS.map(s=>
    `<button type="button" class="search-sector-chip ${state.searchSector===s.key?"on":""}" data-search-sector="${s.key}">
      ${s.label}<span class="n">${fmt(sectorCount(s.key))}</span>
    </button>`
  ).join("");
  searchSectorBar.querySelectorAll("[data-search-sector]").forEach(b=>b.onclick=()=>{
    state.searchSector=b.dataset.searchSector;
    renderSearchSectorBar();
    renderSuggest(input.value);
    suggestList.scrollTop=0;
  });
  if(searchSectorHint){
    const lab=SEARCH_SECTORS.find(x=>x.key===state.searchSector)?.label||"전체";
    searchSectorHint.textContent=`${lab} 기업 · 휠/스크롤바/마우스 드래그/터치 드래그 후 클릭`;
  }
}
function companySearchItem(r){
  return {
    section:`기업 · ${r.sectorLabel}`,
    title:r.companyName,
    sub:`${r.subType||r.ksicName||"수산기업"} · ${r.regionGroup}${r.sales!==null&&r.sales!==undefined?` · 매출 ${fmt(r.sales)}`:""}`,
    action:`select:${r.recordId}`
  }
}
function searchItems(q=""){
  const s=q.trim().toLowerCase();
  const tokens=s.split(/\s+/).filter(Boolean);
  const matched=state.listRows.filter(r=>{
    if(state.searchSector!=="all" && r.sector!==state.searchSector)return false;
    return !tokens.length || tokens.every(t=>(r.searchText||"").includes(t));
  });
  state.lastSuggestTotal=matched.length;

  let companyItems=[];
  if(state.searchSector==="all"){
    // DB 배열 앞부분 편향 제거: 생산/가공/유통/외식 각각 최대 60개씩 표시
    const keys=["production","processing","distribution","foodservice"];
    for(const key of keys){
      companyItems.push(...matched.filter(r=>r.sector===key).slice(0,60).map(companySearchItem));
    }
  }else{
    // 선택 부문은 충분히 스크롤할 수 있게 최대 300개 표시
    companyItems=matched.slice(0,300).map(companySearchItem);
  }

  return state.searchSector==="all"
    ? [...companyItems,...FEATURE_SEARCH_ITEMS]
    : companyItems;
}
function renderSuggest(q=""){
  renderSearchSectorBar();
  const arr=searchItems(q);
  let last="";
  suggestList.innerHTML=arr.map(x=>{
    let h="";
    if(x.section!==last){
      last=x.section;
      h=`<div class="main-suggest-section">${esc(last)}</div>`
    }
    return h+`<button type="button" class="main-suggest-item" data-action="${esc(x.action)}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></button>`
  }).join("") || `<div class="hint">${state.listLoaded?"일치하는 기업이 없습니다.":"통합 DB를 불러오는 중입니다."}</div>`;

  const limit=state.searchSector==="all"?240:300;
  if(state.lastSuggestTotal>limit){
    suggestList.insertAdjacentHTML("beforeend",
      `<div class="hint">검색결과 ${fmt(state.lastSuggestTotal)}개 · 현재 ${fmt(Math.min(limit,state.lastSuggestTotal))}개 표시 · 검색어를 입력하면 더 빠르게 찾을 수 있습니다.</div>`);
  }
  suggestList.querySelectorAll("[data-action]").forEach(b=>b.onclick=e=>{
    if(state.suggestDragging){e.preventDefault();return}
    runAction(b.dataset.action)
  })
}
function showSuggest(){
  if(chat.classList.contains("map-mode")){exitMapMode();setActive("")}
  renderSuggest(input.value);suggest.classList.add("on");dropBtn.classList.add("open");state.suggestOpen=true
}
function hideSuggest(){suggest.classList.remove("on");dropBtn.classList.remove("open");state.suggestOpen=false}
async function runAction(a){hideSuggest();input.value="";if(String(a).startsWith("select:"))return selectCompanyById(String(a).slice(7));if(a==="map")return openMap();if(a==="core")return openCore();if(a==="detail")return openDetail();if(a==="save")return openSave();if(a==="csv")return downloadCsv();if(a==="db")return showDbStatus()}
let suggestDrag={active:false,startY:0,startScroll:0,moved:false};
suggestList.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse" && e.button!==0)return;
  suggestDrag={active:true,startY:e.clientY,startScroll:suggestList.scrollTop,moved:false,pointerId:e.pointerId};
  state.suggestDragging=false;
});
suggestList.addEventListener("pointermove",e=>{
  if(!suggestDrag.active)return;
  const dy=e.clientY-suggestDrag.startY;
  if(Math.abs(dy)>6&&!suggestDrag.moved){
    suggestDrag.moved=true;
    state.suggestDragging=true;
    suggestList.classList.add("dragging");
    try{suggestList.setPointerCapture(e.pointerId)}catch{}
  }
  if(suggestDrag.moved){
    suggestList.scrollTop=suggestDrag.startScroll-dy;
    e.preventDefault();
  }
});
function endSuggestDrag(e){
  if(!suggestDrag.active)return;
  const moved=suggestDrag.moved;
  suggestDrag.active=false;
  suggestList.classList.remove("dragging");
  if(moved){try{suggestList.releasePointerCapture(e.pointerId)}catch{}}
  setTimeout(()=>{state.suggestDragging=false},moved?80:0);
}
suggestList.addEventListener("pointerup",endSuggestDrag);
suggestList.addEventListener("pointercancel",endSuggestDrag);

dropBtn.addEventListener("click",()=>state.suggestOpen?hideSuggest():showSuggest());input.addEventListener("focus",showSuggest);input.addEventListener("input",()=>{renderSuggest(input.value);suggest.classList.add("on")});document.addEventListener("click",e=>{if(!document.getElementById("mainSearchWrap").contains(e.target))hideSuggest()});
document.getElementById("composer").addEventListener("submit",async e=>{e.preventDefault();const q=input.value.trim();if(!q)return showSuggest();add(esc(q),"user");input.value="";hideSuggest();const s=q.toLowerCase();if(s.includes("지도"))return openMap();if(s.includes("핵심")||s.includes("매출")||s.includes("이익"))return openCore();if(s.includes("상세")||s.includes("재무")||s.includes("거래"))return openDetail();if(s.includes("csv")||s.includes("저장"))return downloadCsv();await ensureData();const tokens=s.split(/\s+/).filter(Boolean),matches=state.listRows.filter(r=>(state.searchSector==="all"||r.sector===state.searchSector)&&tokens.every(t=>(r.searchText||"").includes(t)));if(matches.length===1)return selectCompanyById(matches[0].recordId);if(matches.length>1){input.value=q;showSuggest();return}add("일치하는 기업이 없습니다.")});
document.querySelectorAll("#quickNav button").forEach(b=>b.addEventListener("click",()=>runAction(b.dataset.group)));document.getElementById("fontBtn").onclick=()=>document.body.classList.toggle("big");document.getElementById("settingsBtn").onclick=openSettings;

add(`<h3>🤖 수산기업정보 AI</h3>기업명·업종·지역·관련어로 검색하거나 검색창에서 <b>생산·가공·유통·외식</b>을 먼저 선택하십시오.<br><b>7,320개 통합 기업DB</b><br><span class="static-pill">Worker-free</span>`);
const startup=loading("7,320개 통합 DB 연결 중...");
loadStaticData().then(()=>{startup.remove();add(`<span class="badge ok">DB 연결</span> 기업 ${fmt(state.listRows.length)}개 · 고유주소 ${fmt(state.stats?.uniqueAddresses)}개 · 현재 좌표 ${fmt(state.coordinateByKey.size)}개<div class="source">지도 마커는 coordinates.json에 좌표가 있는 주소만 표시됩니다.</div>`);renderSuggest(input.value)}).catch(e=>{startup.remove();add(`<h3>DB 연결 오류</h3><div class="err">${esc(e.message)}</div>`)});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW registration failed",e)))}

</script>
</body>
</html>
